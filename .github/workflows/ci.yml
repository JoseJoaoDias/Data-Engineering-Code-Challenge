name: Simple Build

on:
  push:
    branches:
      - main
      - challenge_dev
  pull_request:
    branches:
      - main
      - challenge_dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install PySpark
        run: 
          python -m pip install --upgrade pip
          pip install pyspark==3.5.1


